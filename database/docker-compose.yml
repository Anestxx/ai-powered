services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: urban_intelligence
      POSTGRES_USER: urban_admin
      POSTGRES_PASSWORD: urban_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urban_admin -d urban_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
